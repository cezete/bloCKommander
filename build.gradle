plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories { mavenCentral() }

loom {
    splitEnvironmentSourceSets()
    mods {
        blockommander {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
    include "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
    implementation 'com.google.code.gson:gson:2.13.2'
    include 'com.google.code.gson:gson:2.13.2'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def expandedModVersion = project.version.toString()
processResources {
    inputs.property 'version', expandedModVersion
    filesMatching('fabric.mod.json') { expand version: expandedModVersion }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompilationTask).configureEach {
    compilerOptions.jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

test { useJUnitPlatform() }

def windowsHost = System.getProperty('os.name').toLowerCase().contains('windows')
def pythonServiceDir = file('python-service')
def pythonVenvDir = file('python-service/.venv')
def pythonVenvExecutable = file("python-service/.venv/${windowsHost ? 'Scripts/python.exe' : 'bin/python'}")
def bootstrapPython = System.getenv('BLOCKCOMMANDER_PYTHON') ?: 'python'

tasks.register('pythonVenv', Exec) {
    description = 'Creates the project-local Python virtual environment when it is missing.'
    onlyIf { !pythonVenvExecutable.isFile() }
    commandLine bootstrapPython, '-m', 'venv', pythonVenvDir.absolutePath
}

tasks.register('pythonSetup', Exec) {
    description = 'Installs the pinned Python service dependencies into the project-local venv.'
    dependsOn tasks.named('pythonVenv')
    workingDir pythonServiceDir
    inputs.file file('python-service/requirements.txt')
    doFirst {
        commandLine pythonVenvExecutable.absolutePath, '-m', 'pip', 'install', '-r', 'requirements.txt'
    }
}

tasks.register('pythonTest', Exec) {
    dependsOn tasks.named('pythonSetup')
    workingDir pythonServiceDir
    commandLine pythonVenvExecutable.absolutePath, '-m', 'unittest', 'discover', '-s', 'tests', '-v'
    environment 'PYTHONPATH', file('python-service/src').absolutePath
}

tasks.register('runtimeBundle', Zip) {
    dependsOn tasks.named('jar')
    archiveFileName = "blockommander-runtime-${project.version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(tasks.named('jar').flatMap { it.archiveFile }) { into 'fabric-server/mods' }
    from('python-service') {
        into 'python-service'
        exclude '.venv/**', '**/__pycache__/**', '**/*.pyc'
    }
    from('deployment') { into 'deployment' }
    from('docs') { into 'docs' }
}

def powershellExecutable = 'powershell.exe'

tasks.register('buildAll') {
    group = 'blockommander'
    description = 'Builds and tests the Fabric mod and Python service, then creates the runtime bundle.'
    dependsOn tasks.named('build'), tasks.named('pythonTest'), tasks.named('runtimeBundle')
}

tasks.register('deployClient', Exec) {
    group = 'blockommander'
    description = 'Builds and copies the mod JAR to the configured local Minecraft client.'
    dependsOn tasks.named('jar')
    commandLine powershellExecutable, '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
        file('deployment/deploy-client.ps1').absolutePath,
        '-JarPath', tasks.named('jar').flatMap { it.archiveFile }.get().asFile.absolutePath
}

tasks.register('deployServerMod', Exec) {
    group = 'blockommander'
    description = 'Deploys only the Fabric mod JAR to the HP server with backup and rollback.'
    dependsOn tasks.named('jar')
    commandLine powershellExecutable, '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
        file('deployment/deploy-hp.ps1').absolutePath, '-Mode', 'Server'
}

tasks.register('deployWebhook', Exec) {
    group = 'blockommander'
    description = 'Deploys only the Python webhook to the HP server with DB backup and rollback.'
    dependsOn tasks.named('pythonTest'), tasks.named('runtimeBundle')
    commandLine powershellExecutable, '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
        file('deployment/deploy-hp.ps1').absolutePath, '-Mode', 'Webhook'
}

tasks.register('deployAll') {
    group = 'blockommander'
    description = 'Deploys the client JAR, Python webhook, and server mod in that order.'
    dependsOn tasks.named('deployClient'), tasks.named('deployWebhook'), tasks.named('deployServerMod')
}

tasks.named('deployWebhook') { mustRunAfter tasks.named('deployClient') }
tasks.named('deployServerMod') { mustRunAfter tasks.named('deployWebhook') }
